[global]
   workgroup = LAB
   server string = PFG Lab File Server
   security = user
   map to guest = bad user
   log file = /var/log/samba/log.%m
   max log size = 1000

[labprueba]
   path = /opt/labprueba
   browseable = yes
   read only = no
   guest ok = no
   valid users = lab
   create mask = 0664
   directory mask = 0775
